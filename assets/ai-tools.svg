<svg xmlns="http://www.w3.org/2000/svg" width="830" height="134" viewBox="0 0 830 134">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0e4429"/><stop offset="0.5" stop-color="#39d353"/><stop offset="1" stop-color="#0e4429"/><animate attributeName="x1" values="-1;1" dur="5s" repeatCount="indefinite"/><animate attributeName="x2" values="0;2" dur="5s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="chip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14231a"/><stop offset="1" stop-color="#0d1a12"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Roboto,Arial,sans-serif;text-rendering:optimizeLegibility}
.t{font-size:15px;font-weight:700;fill:#39d353;letter-spacing:2px}
.c{font-size:14px;font-weight:500;fill:#e6edf3;letter-spacing:0.3px}
.chip{opacity:0;animation:in .6s ease-out forwards}
.chip rect{stroke:#26a641;stroke-width:1}
.glow{animation:pulse 3.2s ease-in-out infinite}
.dot{fill:#39d353;animation:blink 1.8s ease-in-out infinite}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{stroke-opacity:.4}50%{stroke-opacity:1}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
</style>
<rect x="1" y="1" width="828" height="132" rx="14" fill="#0d1117" stroke="url(#g)" stroke-width="2"/>
<circle class="dot" cx="34" cy="35" r="4.5"/>
<text class="t" x="48" y="40">AI TOOLS AND LIBRARIES</text>
<line x1="28" y1="56" x2="802" y2="56" stroke="#21362a" stroke-width="1"/>
<g class="chip" style="animation-delay:0.10s"><rect class="glow" style="animation-delay:0.0s" x="28" y="72" width="89" height="36" rx="18" fill="url(#chip)"/><text class="c" x="72.5" y="95" text-anchor="middle">Claude</text></g>
<g class="chip" style="animation-delay:0.18s"><rect class="glow" style="animation-delay:0.4s" x="129" y="72" width="113" height="36" rx="18" fill="url(#chip)"/><text class="c" x="185.5" y="95" text-anchor="middle">LangChain</text></g>
<g class="chip" style="animation-delay:0.26s"><rect class="glow" style="animation-delay:0.8s" x="254" y="72" width="138" height="36" rx="18" fill="url(#chip)"/><text class="c" x="323.0" y="95" text-anchor="middle">Hugging Face</text></g>
<g class="chip" style="animation-delay:0.34s"><rect class="glow" style="animation-delay:1.2s" x="404" y="72" width="97" height="36" rx="18" fill="url(#chip)"/><text class="c" x="452.5" y="95" text-anchor="middle">PyTorch</text></g>
<g class="chip" style="animation-delay:0.42s"><rect class="glow" style="animation-delay:1.6s" x="513" y="72" width="122" height="36" rx="18" fill="url(#chip)"/><text class="c" x="574.0" y="95" text-anchor="middle">TensorFlow</text></g>
</svg>