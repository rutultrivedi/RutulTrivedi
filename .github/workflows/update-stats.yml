name: Update 30-day activity card

on:
  schedule:
    - cron: '30 0 * * *'   # daily at 00:30 UTC
  workflow_dispatch:        # allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate stats card
        env:
          # classic personal access token with the read:user scope, saved as a repository secret
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/stats-30d.svg README.md
            git commit -m "Update 30-day activity card"
            git push
          else
            echo "No changes."
          fi
